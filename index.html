<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Elite Stay – Management Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="loginPage" class="login-page">
        <section class="login-card" aria-label="Admin Login">
            <div class="login-logo"><i class="bi bi-house-door"></i></div>
            <h1>The Elite Stay</h1>
            <p>Management Report</p>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="password" class="form-label">Admin Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <p id="loginError" class="login-error" role="alert"></p>
                <button type="submit" class="btn login-button w-100">Login</button>
            </form>
        </section>
    </main>

    <main id="mainArea" class="app-shell d-none" aria-hidden="true">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-house"><i class="bi bi-house-door"></i></div>
                <div class="brand-title">The Elite Stay</div>
                <div class="brand-subtitle">Management Report</div>
            </div>
            <div id="moduleNav" class="module-nav" aria-label="Main modules"></div><nav id="sideNav" class="side-nav" aria-label="Module navigation"></nav>
        </aside>

        <section class="content-area">
            <header class="topbar">
                <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Open menu"><i class="bi bi-list"></i></button>
                <div class="topbar-brand">
                    <div class="topbar-house"><i class="bi bi-house-door"></i></div>
                    <div>
                        <div class="topbar-title">The Elite Stay</div>
                        <div class="topbar-subtitle">Management Report</div>
                    </div>
                </div>

                <div class="topbar-actions ms-auto">
                    <label class="month-control" aria-label="Select month">
                        <i class="bi bi-calendar3"></i>
                        <select id="monthSelect"></select>
                    </label>
                    <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="Notifications"><i class="bi bi-bell"></i><span class="notification-dot"></span></button>
                    <button class="admin-button" id="adminButton" type="button" aria-expanded="false"><span class="admin-avatar"><i class="bi bi-person-fill"></i></span><span class="admin-label">Admin</span><i class="bi bi-chevron-down"></i></button>
                    <div class="admin-menu d-none" id="adminMenu"><button id="logoutButton" type="button"><i class="bi bi-box-arrow-right"></i> Logout</button></div>
                </div>
            </header>

            <div id="notificationPanel" class="notification-panel d-none">
                <strong><i class="bi bi-bell"></i> Notifications</strong>
                <span>No new notifications.</span>
            </div>

            <div class="dashboard-content">
                <div id="moduleContent"></div>
            </div>
        </section>
    </main>

    <nav id="mobileBottomNav" class="mobile-bottom-nav d-none" aria-label="Main mobile navigation">
        <button type="button" data-module="profile"><i class="bi bi-person-fill"></i><span>Profile</span></button>
        <button type="button" data-module="payment"><i class="bi bi-credit-card"></i><span>Payment</span></button>
        <button type="button" data-module="expense"><i class="bi bi-coin"></i><span>Expense</span></button>
        <button type="button" data-module="more"><i class="bi bi-grid"></i><span>More</span></button>
    </nav>

    <div class="modal fade" id="genericModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content app-modal">
                <div class="modal-header"><h5 class="modal-title" id="genericModalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body" id="genericModalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
