<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Elite Stay Management Report</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Admin Login -->
    <main id="loginPage" class="login-page">
        <section class="login-card" aria-label="Admin Login">
            <h1>Admin Login</h1>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="loginError" class="login-error" role="alert"></p>

                <button type="submit" class="btn login-button w-100">
                    Login
                </button>
            </form>
        </section>
    </main>

    <!-- Empty website area after successful login -->
    <main id="mainArea" class="main-area d-none" aria-hidden="true"></main>

    <!-- Custom JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
