<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Elite Stay – Management Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ================= ADMIN LOGIN PAGE ================= -->
    <main id="loginPage" class="login-page">
        <section class="login-card" aria-label="Admin Login">
            <div class="login-brand">
                <div class="login-logo"><i class="bi bi-house-door"></i></div>
                <h1>The Elite Stay</h1>
                <p>Management Report &bull; Admin Login</p>
            </div>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Admin Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock text-primary"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
                    </div>
                </div>
                <p id="loginError" class="login-error" role="alert"></p>
                <button type="submit" class="btn btn-primary login-button w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login to Dashboard
                </button>
            </form>
        </section>
    </main>

    <!-- ================= MAIN APPLICATION SHELL ================= -->
    <div id="mainArea" class="app-shell d-none" aria-hidden="true">
        <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

        <!-- DESKTOP / DRAWER LEFT SIDEBAR -->
        <aside class="sidebar" id="sidebar" aria-label="Module Navigation">
            <div class="sidebar-brand">
                <div class="brand-house-icon"><i class="bi bi-house"></i></div>
                <div class="brand-title">The Elite Stay</div>
                <div class="brand-subtitle">Management Report</div>
            </div>
            <nav class="side-nav" id="sidebarNav" aria-label="Main Sidebar Menu">
                <!-- Dynamically populated according to active module -->
            </nav>
        </aside>

        <!-- RIGHT CONTENT AREA -->
        <div class="content-area">
            <!-- TOP NAVBAR -->
            <header class="topbar">
                <button class="icon-btn menu-button" id="menuButton" type="button" aria-label="Toggle Menu" aria-controls="sidebar" aria-expanded="false">
                    <i class="bi bi-list"></i>
                </button>

                <div class="topbar-brand">
                    <div class="topbar-house-icon"><i class="bi bi-house"></i></div>
                    <div>
                        <div class="topbar-title">The Elite Stay</div>
                        <div class="topbar-subtitle">Management Report</div>
                    </div>
                </div>

                <!-- DESKTOP COMMON MONTH SELECTOR -->
                <div class="month-control desktop-month-control">
                    <i class="bi bi-calendar3"></i>
                    <select id="monthSelectDesktop" aria-label="Select Month"></select>
                </div>

                <div class="topbar-actions">
                    <!-- Notification Bell Dropdown -->
                    <div class="dropdown">
                        <button class="icon-btn position-relative" id="notifButton" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Notifications">
                            <i class="bi bi-bell"></i>
                            <span id="notifDot" class="notif-dot"></span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end notif-dropdown shadow-lg border-0 p-0" aria-labelledby="notifButton">
                            <div class="notif-header">
                                <span>Month Overview</span>
                                <span id="notifMonthBadge" class="badge bg-primary-subtle text-primary">Dec 2026</span>
                            </div>
                            <div id="notifBody" class="notif-body"></div>
                        </div>
                    </div>

                    <!-- Admin Profile Dropdown -->
                    <div class="dropdown">
                        <button class="admin-pill dropdown-toggle" id="adminMenuBtn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="admin-avatar"><i class="bi bi-person-fill"></i></span>
                            <span class="admin-label">Admin</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2">
                            <li class="px-3 py-2 border-bottom">
                                <div class="fw-semibold small text-dark">Administrator</div>
                                <div class="text-muted" style="font-size: 12px;">Session: <span id="sessionTimerLabel">30s</span> left</div>
                            </li>
                            <li>
                                <button class="dropdown-item text-danger py-2" id="logoutButton" type="button">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- MOBILE COMMON MONTH SELECTOR STRIP -->
            <div class="mobile-month-bar">
                <div class="month-control mobile-month-control">
                    <i class="bi bi-calendar3"></i>
                    <select id="monthSelectMobile" aria-label="Select Month (Mobile)"></select>
                </div>
            </div>

            <!-- DYNAMIC MODULE CONTENT -->
            <main id="moduleContainer" class="dashboard-content">
                <!-- Active module renders here -->
            </main>
        </div>

        <!-- MOBILE FIXED BOTTOM NAVIGATION (EXACTLY 4 BUTTONS) -->
        <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Mobile Bottom Navigation">
            <button type="button" class="bottom-nav-btn active" data-module="profile">
                <i class="bi bi-person-fill"></i>
                <span>Profile</span>
            </button>
            <button type="button" class="bottom-nav-btn" data-module="payment">
                <i class="bi bi-credit-card-2-front"></i>
                <span>Payment</span>
            </button>
            <button type="button" class="bottom-nav-btn" data-module="expense">
                <i class="bi bi-cash-coin"></i>
                <span>Expense</span>
            </button>
            <button type="button" class="bottom-nav-btn" data-module="more">
                <i class="bi bi-grid"></i>
                <span>More</span>
            </button>
        </nav>
    </div>

    <!-- REUSABLE DETAIL / RECEIPT / DOCUMENT MODAL -->
    <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary-navy text-white rounded-top-4">
                    <h5 class="modal-title fw-bold" id="appModalTitle">Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="appModalBody"></div>
                <div class="modal-footer border-0 bg-light rounded-bottom-4">
                    <button type="button" class="btn btn-secondary rounded-3 px-4" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
